name: Build iPhone app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: xcodebuild -project Luma.xcodeproj -scheme Luma -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Luma.app package/Payload/
          cd package
          zip -qr ../Luma-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-unsigned-ipa
          path: Luma-unsigned.ipa

