name: Luma
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.personal.lumacamera
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  Luma:
    type: application
    platform: iOS
    sources: [Luma]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Luma
        INFOPLIST_KEY_NSCameraUsageDescription: Luma uses the camera to capture photographs.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Luma saves exported photographs to your photo library.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets: []

